<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f23"/>
      <stop offset="50%" style="stop-color:#0f1932"/>
      <stop offset="100%" style="stop-color:#0a1228"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffb347"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Stars -->
  <g fill="white" opacity="0.8">
    <circle cx="100" cy="80" r="2"/>
    <circle cx="200" cy="150" r="1.5"/>
    <circle cx="350" cy="50" r="2"/>
    <circle cx="450" cy="120" r="1"/>
    <circle cx="550" cy="80" r="2.5"/>
    <circle cx="650" cy="160" r="1.5"/>
    <circle cx="750" cy="60" r="2"/>
    <circle cx="850" cy="130" r="1"/>
    <circle cx="950" cy="90" r="2"/>
    <circle cx="1050" cy="140" r="1.5"/>
    <circle cx="1100" cy="70" r="2"/>
    <circle cx="150" cy="200" r="1"/>
    <circle cx="300" cy="180" r="1.5"/>
    <circle cx="500" cy="200" r="1"/>
    <circle cx="700" cy="220" r="2"/>
    <circle cx="900" cy="200" r="1"/>
    <circle cx="1000" cy="190" r="1.5"/>
  </g>
  
  <!-- Fireworks -->
  <g filter="url(#glow)">
    <!-- Left firework -->
    <circle cx="250" cy="180" r="4" fill="#ffd700"/>
    <line x1="250" y1="180" x2="210" y2="140" stroke="#ffd700" stroke-width="2"/>
    <line x1="250" y1="180" x2="290" y2="140" stroke="#ffd700" stroke-width="2"/>
    <line x1="250" y1="180" x2="200" y2="180" stroke="#ffd700" stroke-width="2"/>
    <line x1="250" y1="180" x2="300" y2="180" stroke="#ffd700" stroke-width="2"/>
    <line x1="250" y1="180" x2="220" y2="220" stroke="#ffd700" stroke-width="2"/>
    <line x1="250" y1="180" x2="280" y2="220" stroke="#ffd700" stroke-width="2"/>
    
    <!-- Right firework -->
    <circle cx="950" cy="150" r="4" fill="#ff69b4"/>
    <line x1="950" y1="150" x2="910" y2="110" stroke="#ff69b4" stroke-width="2"/>
    <line x1="950" y1="150" x2="990" y2="110" stroke="#ff69b4" stroke-width="2"/>
    <line x1="950" y1="150" x2="900" y2="150" stroke="#ff69b4" stroke-width="2"/>
    <line x1="950" y1="150" x2="1000" y2="150" stroke="#ff69b4" stroke-width="2"/>
    <line x1="950" y1="150" x2="920" y2="190" stroke="#ff69b4" stroke-width="2"/>
    <line x1="950" y1="150" x2="980" y2="190" stroke="#ff69b4" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" letter-spacing="8" filter="url(#glow)">
    NEW YEAR'S EVE COUNTDOWN
  </text>
  
  <!-- Countdown box -->
  <rect x="200" y="320" width="800" height="120" rx="20" fill="url(#gold)" opacity="0.95"/>
  
  <!-- Countdown numbers -->
  <text x="600" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" letter-spacing="4">
    00 : 00 : 00 : 00
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.8">
    🎆 Celebrate with family photos &amp; fireworks 🎇
  </text>
  
  <!-- Footer -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.5">
    Personalize your countdown • Cast to TV • 21 Languages
  </text>
</svg>

